<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics — Admin Panel</title>
<link rel="stylesheet" href="../../shared/css/common.css">
<style>
.chart-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);}
.chart-card h3{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:20px;}
</style>
</head><body>
<div class="sidebar">
  <div class="sidebar-logo"><h2>🛡️ Admin Panel</h2><span>Smart Fee Engine</span></div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
    <a class="nav-item" href="students.html"><span class="nav-icon">🎓</span> Students</a>
    <a class="nav-item" href="defaulters.html"><span class="nav-icon">⚠️</span> Defaulters</a>
    <a class="nav-item" href="emi-approvals.html"><span class="nav-icon">📅</span> EMI Approvals</a>
    <a class="nav-item" href="reminders.html"><span class="nav-icon">🔔</span> Reminders</a>
    <a class="nav-item" href="upload.html"><span class="nav-icon">📤</span> Upload Dataset</a>
    <a class="nav-item active" href="analytics.html"><span class="nav-icon">📈</span> Analytics</a>
  </nav>
  <div class="sidebar-bottom"><button class="nav-item" onclick="logout('admin')"><span class="nav-icon">🚪</span> Logout</button></div>
</div>
<div class="main-content">
  <div class="topbar"><div class="topbar-title">📈 Financial Analytics</div></div>
  <div class="page-content">
    <div class="grid-4" id="summaryStats" style="margin-bottom:24px;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
      <div class="chart-card"><h3>📅 Monthly Fee Collection Trend</h3><canvas id="monthlyTrend" height="250"></canvas></div>
      <div class="chart-card"><h3>🏛️ Dept-wise Paid vs Pending</h3><canvas id="deptBar" height="250"></canvas></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;">
      <div class="chart-card"><h3>📊 Fee Status Breakdown</h3><canvas id="statusPie" height="250"></canvas></div>
      <div class="chart-card"><h3>⚖️ Revenue Summary</h3><canvas id="revBar" height="250"></canvas></div>
      <div class="chart-card"><h3>🏆 Dept Collection Rate</h3><canvas id="deptRate" height="250"></canvas></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="../../shared/js/utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
if(!localStorage.getItem('admin_user'))window.location.href='../../index.html';
const COLORS=['#1e3a5f','#10b981','#f59e0b','#ef4444','#3b82f6','#8b5cf6'];
async function load(){
  const d=await api('/admin/analytics');
  if(!d)return;
  const s=d.summary;
  const pct=Math.round((s.total_collected/s.total_fee)*100);
  document.getElementById('summaryStats').innerHTML=`
    <div class="stat-card"><div class="stat-icon blue">💰</div><div><div class="stat-value">${fmt(s.total_fee)}</div><div class="stat-label">Total Expected</div></div></div>
    <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-value">${fmt(s.total_collected)}</div><div class="stat-label">Collected (${pct}%)</div></div></div>
    <div class="stat-card"><div class="stat-icon orange">⏳</div><div><div class="stat-value">${fmt(s.total_pending)}</div><div class="stat-label">Pending Revenue</div></div></div>
    <div class="stat-card"><div class="stat-icon red">⚠️</div><div><div class="stat-value">${s.defaulters}</div><div class="stat-label">Defaulters</div></div></div>
  `;
  const mc=d.monthly_collection.slice().reverse();
  new Chart(document.getElementById('monthlyTrend'),{type:'line',data:{
    labels:mc.map(r=>r.month),
    datasets:[{label:'Amount Collected (₹)',data:mc.map(r=>r.collected),borderColor:'#1e3a5f',backgroundColor:'rgba(30,58,95,0.08)',fill:true,tension:0.4,pointBackgroundColor:'#1e3a5f'}]
  },options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});

  const dd=d.by_department;
  new Chart(document.getElementById('deptBar'),{type:'bar',data:{
    labels:dd.map(r=>r.department),
    datasets:[{label:'Paid',data:dd.map(r=>r.paid),backgroundColor:'#10b981'},{label:'Pending',data:dd.map(r=>r.pending),backgroundColor:'#ef4444'}]
  },options:{plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true}}}});

  const sd=d.status_distribution;
  new Chart(document.getElementById('statusPie'),{type:'doughnut',data:{
    labels:sd.map(r=>r.fee_status),
    datasets:[{data:sd.map(r=>r.cnt),backgroundColor:['#10b981','#f59e0b','#ef4444'],borderWidth:2,borderColor:'#fff'}]
  },options:{plugins:{legend:{position:'bottom'}},cutout:'55%'}});

  new Chart(document.getElementById('revBar'),{type:'bar',data:{
    labels:['Revenue'],
    datasets:[
      {label:'Collected',data:[s.total_collected],backgroundColor:'#10b981'},
      {label:'Pending',data:[s.total_pending],backgroundColor:'#f59e0b'}
    ]
  },options:{indexAxis:'y',plugins:{legend:{position:'bottom'}}}});

  const rates=dd.map(r=>({dept:r.department,rate:Math.round((r.paid/r.total)*100)}));
  new Chart(document.getElementById('deptRate'),{type:'bar',data:{
    labels:rates.map(r=>r.dept),
    datasets:[{label:'Collection Rate (%)',data:rates.map(r=>r.rate),backgroundColor:rates.map(r=>r.rate>75?'#10b981':r.rate>50?'#f59e0b':'#ef4444')}]
  },options:{plugins:{legend:{display:false}},scales:{y:{max:100,beginAtZero:true,ticks:{callback:v=>v+'%'}}}}});
}
load();
</script>
</body></html>
