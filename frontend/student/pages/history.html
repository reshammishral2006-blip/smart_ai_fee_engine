<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment History — Smart Fee Engine</title>
<link rel="stylesheet" href="../../shared/css/common.css">
</head><body>
<div class="sidebar">
  <div class="sidebar-logo"><h2>🎓 Smart Fee Engine</h2><span>Student Portal</span></div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
    <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span> My Profile</a>
    <a class="nav-item" href="payments.html"><span class="nav-icon">💳</span> Pay Fees</a>
    <a class="nav-item active" href="history.html"><span class="nav-icon">📋</span> Payment History</a>
    <a class="nav-item" href="emi.html"><span class="nav-icon">📅</span> EMI Plan</a>
    <a class="nav-item" href="receipts.html"><span class="nav-icon">🧾</span> Receipts</a>
  </nav>
  <div class="sidebar-bottom"><button class="nav-item" onclick="logout()"><span class="nav-icon">🚪</span> Logout</button></div>
</div>
<div class="main-content">
  <div class="topbar"><div class="topbar-title">📋 Payment History</div></div>
  <div class="page-content">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="card-title" style="margin:0">All Transactions</div>
        <div id="totalPaidStat" style="font-weight:700;font-size:16px;color:#10b981;"></div>
      </div>
      <div id="historyTable"><div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto"></div></div></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="../../shared/js/utils.js"></script>
<script>
const sid=localStorage.getItem('student_id');
if(!sid)window.location.href='../../index.html';
async function load(){
  const data=await api(`/student/history?student_id=${sid}`);
  if(!data)return;
  const total=data.reduce((s,r)=>s+r.amount,0);
  document.getElementById('totalPaidStat').textContent=`Total Paid: ${fmt(total)}`;
  if(!data.length){document.getElementById('historyTable').innerHTML='<div style="text-align:center;padding:40px;color:#718096;">No payment records found.</div>';return;}
  document.getElementById('historyTable').innerHTML=`
    <table class="table">
      <thead><tr><th>#</th><th>Date</th><th>Amount</th><th>Method</th><th>Txn ID</th><th>Receipt</th><th>Status</th></tr></thead>
      <tbody>${data.map((p,i)=>`<tr>
        <td>${i+1}</td><td>${formatDate(p.payment_date)}</td>
        <td><strong>${fmt(p.amount)}</strong></td>
        <td>${p.method||'—'}</td>
        <td><code style="font-size:12px">${p.txn_id}</code></td>
        <td><a href="${API}/student/receipt/${p.receipt_no}" target="_blank" class="btn btn-sm btn-outline">🧾 View</a></td>
        <td>${statusBadge(p.status)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
}
load();
</script>
</body></html>
